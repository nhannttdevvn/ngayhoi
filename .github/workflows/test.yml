name: pytest

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fastapi uvicorn pytest httpx

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q
